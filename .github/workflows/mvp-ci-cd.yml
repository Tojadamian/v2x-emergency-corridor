name: V2X MVP CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: v2x-service

jobs:
  test:
    name: Quality Gates & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements.txt
      - name: Run full pytest suite
        env:
          STORAGE_BACKEND: memory
        run: |
          PYTHONPATH=. ./.venv/bin/pytest -q tests/
          PYTHONPATH=. ./.venv/bin/python -m experiments.run_experiments

  build-and-publish:
    name: Publish Image to ECR & Static Files to S3
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Academy Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish cloud and RSU images to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for repository in "$ECR_REPOSITORY" v2x-rsu; do
            aws ecr describe-repositories --repository-names "$repository" ||
              aws ecr create-repository --repository-name "$repository"
          done
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$REGISTRY/v2x-rsu:$IMAGE_TAG" -t "$REGISTRY/v2x-rsu:latest" .
          for repository in "$ECR_REPOSITORY" v2x-rsu; do
            docker push "$REGISTRY/$repository:$IMAGE_TAG"
            docker push "$REGISTRY/$repository:latest"
          done

      - name: Sync Static Dashboard Assets & Deployment Bundle to Amazon S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 sync ./static s3://$S3_BUCKET/static/ --delete
          aws s3 sync ./deploy s3://$S3_BUCKET/deploy/ --delete
